version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One pull request per week for routine compatible updates; anything
      # breaking still arrives as its own reviewable PR.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # Its tags are Rust toolchain versions, not action releases: the MSRV
      # job pins the declared minimum and must never be "upgraded".
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
