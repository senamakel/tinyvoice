[package]
name = "tinyvoice-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Typed TinyBus host client for the TinyVoice module."
repository = "https://github.com/tinyhumansai/tinyvoice"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyvoice-bus = { version = "0.1.4", path = "../tinyvoice-bus" }
tinybus = { version = ">=0.2.2, <0.3", path = "../../vendor/tinybus/crates/tinybus", default-features = false }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tinybus = { version = ">=0.2.2, <0.3", path = "../../vendor/tinybus/crates/tinybus", default-features = false }

[lints]
workspace = true
