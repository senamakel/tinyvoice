[package]
name = "tinyvoice-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Typed TinyBus host client for the TinyVoice module."
repository = "https://github.com/tinyhumansai/tinyvoice"

[dependencies]
# The contract carries audio samples as base64 text.
base64 = "0.22"
# TinyBus serializes contract values and deserializes their replies.
serde = "1"
# The module's transforms and stateful replies are inner JSON strings.
serde_json = "1"
# Shared TinyVoice member names, request types, and typed replies.
tinyvoice-bus = { version = "0.1.4", path = "../tinyvoice-bus" }
# TinyBus 0.3.3 publishes the terminal stream verdict before reader EOF.
tinybus = { version = ">=0.3.3, <0.4", path = "../../vendor/tinybus/crates/tinybus", default-features = false }

[dev-dependencies]
# Implements the async in-memory service used by the broker tests.
async-trait = "0.1"
# Provides the async test executor and `#[tokio::test]` macro.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
